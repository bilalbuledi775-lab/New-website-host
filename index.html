<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Space: Virtual Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #020205; 
            color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; 
            touch-action: none; 
        }
        
        /* The "Virtual" Glow Effect */
        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            filter: brightness(1.2) contrast(1.1) drop-shadow(0 0 5px rgba(0, 255, 255, 0.3));
        }

        /* Scanline CRT effect */
        #game-wrapper::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            z-index: 5;
        }

        canvas { display: block; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 15px; z-index: 10; }
        .hud-top { display: flex; justify-content: space-between; font-weight: bold; text-shadow: 0 0 10px #0ff; }
        .health-bar-container { width: 120px; height: 12px; background: rgba(0,255,255,0.1); border: 1px solid #0ff; border-radius: 2px; overflow: hidden; }
        #health-bar { width: 100%; height: 100%; background: #0ff; box-shadow: 0 0 15px #0ff; transition: width 0.2s; }
        
        #boss-ui { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); width: 70%; display: none; }
        .boss-health-bg { width: 100%; height: 8px; background: rgba(255,0,0,0.1); border: 1px solid #f00; }
        #boss-health-bar { width: 100%; height: 100%; background: #f00; box-shadow: 0 0 10px #f00; }

        #screens { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 2, 5, 0.9); z-index: 20; }
        h1 { font-size: 3rem; color: #0ff; text-shadow: 0 0 20px #0ff; margin-bottom: 5px; letter-spacing: 5px; }
        button { padding: 15px 40px; font-size: 1.2rem; font-weight: bold; background: transparent; color: #0ff; border: 2px solid #0ff; border-radius: 5px; cursor: pointer; margin-top: 20px; transition: 0.3s; box-shadow: inset 0 0 10px #0ff, 0 0 10px #0ff; }
        button:active { background: #0ff; color: #000; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer" class="hidden">
            <div class="hud-top">
                <div>LVL: <span id="levelText">1</span></div>
                <div>SCORE: <span id="scoreText">0</span></div>
                <div class="health-bar-container"><div id="health-bar"></div></div>
            </div>
            <div id="boss-ui">
                <div style="color:#f00; font-size:0.7rem; text-align:center; margin-bottom:4px; letter-spacing: 2px;">BOSS SYSTEM ONLINE</div>
                <div class="boss-health-bg"><div id="boss-health-bar"></div></div>
            </div>
        </div>

        <div id="screens">
            <h1 id="titleText">VIRTUAL WARS</h1>
            <p id="subText">TOUCH TO INITIALIZE SOUND & GAME</p>
            <button id="startBtn">START</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiLayer = document.getElementById('ui-layer'), screens = document.getElementById('screens');
    const startBtn = document.getElementById('startBtn'), scoreText = document.getElementById('scoreText');
    const healthBar = document.getElementById('health-bar'), levelText = document.getElementById('levelText');
    const bossUi = document.getElementById('boss-ui'), bossHealthBar = document.getElementById('boss-health-bar');

    let canvasWidth, canvasHeight, isGameOver = true, score = 0, frameCount = 0, level = 1, bossActive = false;
    let bullets = [], enemies = [], particles = [], stars = [], powerups = [], boss = null;

    // --- AUDIO SYNTHESIZER ---
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'shoot') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(); osc.stop(now + 0.1);
        } else if (type === 'explosion') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(40, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.start(); osc.stop(now + 0.2);
        } else if (type === 'powerup') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(); osc.stop(now + 0.3);
        }
    }

    function resize() { 
        canvasWidth = window.innerWidth; canvasHeight = window.innerHeight; 
        canvas.width = canvasWidth; canvas.height = canvasHeight; 
    }
    window.addEventListener('resize', resize); resize();

    // --- CLASSES ---
    class Star {
        constructor() { this.x = Math.random()*canvasWidth; this.y = Math.random()*canvasHeight; this.size = Math.random()*2; this.speed = Math.random()*4 + 1; }
        update() { this.y += this.speed; if(this.y > canvasHeight) { this.y = 0; this.x = Math.random()*canvasWidth; } }
        draw() { ctx.fillStyle = "rgba(0, 255, 255, 0.4)"; ctx.fillRect(this.x, this.y, this.size, this.size); }
    }

    class Player {
        constructor() {
            this.x = canvasWidth/2; this.y = canvasHeight-100; this.width = 40; this.height = 45;
            this.hp = 100; this.maxHp = 100; this.shield = 0; this.multiShot = 0;
        }
        draw() {
            ctx.save(); ctx.translate(this.x, this.y);
            if(this.shield > 0) {
                ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
                ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI*2); ctx.stroke();
            }
            ctx.fillStyle = '#0ff'; ctx.shadowBlur = 20; ctx.shadowColor = '#0ff';
            ctx.beginPath(); ctx.moveTo(0, -25); ctx.lineTo(22, 20); ctx.lineTo(0, 8); ctx.lineTo(-22, 20); ctx.closePath(); ctx.fill();
            ctx.restore();
        }
        shoot() {
            playSound('shoot');
            if(this.multiShot > 0) {
                bullets.push(new Bullet(this.x, this.y-20, 0));
                bullets.push(new Bullet(this.x, this.y-20, -3));
                bullets.push(new Bullet(this.x, this.y-20, 3));
                this.multiShot--;
            } else {
                bullets.push(new Bullet(this.x, this.y-20, 0));
            }
        }
    }

    class Bullet {
        constructor(x, y, vx) { this.x = x; this.y = y; this.vx = vx; this.speed = 12; this.marked = false; }
        update() { this.y -= this.speed; this.x += this.vx; if(this.y < 0) this.marked = true; }
        draw() { 
            ctx.fillStyle = '#fff'; ctx.shadowBlur = 10; ctx.shadowColor = '#0ff';
            ctx.fillRect(this.x-1.5, this.y, 3, 18); 
        }
    }

    class Enemy {
        constructor() {
            this.width = 30; this.height = 30; this.x = Math.random()*(canvasWidth-40)+20; this.y = -50;
            this.speed = Math.random()*2 + (level * 0.5); this.type = Math.floor(Math.random()*3); this.marked = false;
        }
        update() { this.y += this.speed; if(this.y > canvasHeight) this.marked = true; }
        draw() {
            ctx.save(); ctx.translate(this.x, this.y); ctx.fillStyle = '#f22'; ctx.shadowBlur = 15; ctx.shadowColor = '#f22';
            ctx.beginPath();
            if(this.type === 0) { ctx.moveTo(0, -15); ctx.lineTo(15, 0); ctx.lineTo(0, 15); ctx.lineTo(-15, 0); }
            else if(this.type === 1) { ctx.moveTo(0, 18); ctx.lineTo(-18, -10); ctx.lineTo(0, -2); ctx.lineTo(18, -10); }
            else { ctx.rect(-12, -12, 24, 24); }
            ctx.fill(); ctx.restore();
        }
    }

    class Boss {
        constructor() {
            this.x = canvasWidth/2; this.y = -150; this.targetY = 120; this.hp = 150 * level; this.maxHp = 150 * level;
            this.width = 150; this.speed = 3; this.dir = 1;
        }
        update() {
            if(this.y < this.targetY) this.y += 1.5;
            else {
                this.x += this.speed * this.dir;
                if(this.x > canvasWidth - 80 || this.x < 80) this.dir *= -1;
            }
            if(frameCount % 30 === 0) enemies.push(new Enemy());
        }
        draw() {
            ctx.save(); ctx.translate(this.x, this.y); ctx.fillStyle = '#f00'; ctx.shadowBlur = 40; ctx.shadowColor = '#f00';
            ctx.beginPath(); ctx.moveTo(0, 60); ctx.lineTo(80, -20); ctx.lineTo(40, -60); ctx.lineTo(-40, -60); ctx.lineTo(-80, -20); ctx.closePath(); ctx.fill();
            // Glow Eye
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 15 + Math.sin(frameCount*0.1)*5, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }
    }

    class PowerUp {
        constructor() {
            this.x = Math.random()*(canvasWidth-40)+20; this.y = -50; this.speed = 2.5;
            this.type = ['S','M','H'][Math.floor(Math.random()*3)];
            this.marked = false;
        }
        update() { this.y += this.speed; if(this.y > canvasHeight) this.marked = true; }
        draw() {
            let colors = { 'S': '#0ff', 'M': '#ff0', 'H': '#0f0' };
            ctx.save(); ctx.translate(this.x, this.y);
            ctx.shadowBlur = 15; ctx.shadowColor = colors[this.type];
            ctx.strokeStyle = colors[this.type]; ctx.lineWidth = 2; ctx.strokeRect(-15, -15, 30, 30);
            ctx.fillStyle = colors[this.type]; ctx.font = "bold 16px Courier"; ctx.textAlign = 'center'; ctx.fillText(this.type, 0, 6);
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.color = color;
            this.vx = (Math.random()-0.5)*8; this.vy = (Math.random()-0.5)*8; this.life = 1;
        }
        update() { this.x += this.vx; this.y += this.vy; this.life -= 0.03; }
        draw() { ctx.globalAlpha = this.life; ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, 2, 2); ctx.globalAlpha = 1; }
    }

    // --- GAME ENGINE ---
    function initGame() {
        initAudio();
        score = 0; level = 1; frameCount = 0; isGameOver = false; bossActive = false; boss = null;
        bullets = []; enemies = []; particles = []; powerups = []; stars = [];
        player = new Player();
        for(let i=0; i<60; i++) stars.push(new Star());
        uiLayer.classList.remove('hidden'); screens.classList.add('hidden'); bossUi.style.display = 'none';
        animate();
    }

    function animate() {
        if(isGameOver) return;
        ctx.fillStyle = 'rgba(2, 2, 5, 0.3)'; // Trail effect
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
        
        stars.forEach(s => { s.update(); s.draw(); });
        player.draw();
        
        // Auto-shoot speed
        if(frameCount % 12 === 0) player.shoot();

        level = Math.floor(score/600) + 1;
        levelText.innerText = level;
        
        if(level % 5 === 0 && !bossActive) { 
            bossActive = true; boss = new Boss(); 
            bossUi.style.display = 'block'; 
            playSound('powerup');
        }

        if(bossActive && boss) {
            boss.update(); boss.draw();
            bossHealthBar.style.width = (boss.hp/boss.maxHp)*100 + '%';
        } else if(frameCount % Math.max(8, 45 - level*2) === 0) {
            enemies.push(new Enemy());
        }

        if(frameCount % 500 === 0) powerups.push(new PowerUp());

        bullets.forEach(b => { b.update(); b.draw(); });
        enemies.forEach(e => { e.update(); e.draw(); });
        powerups.forEach(p => { p.update(); p.draw(); });
        particles.forEach(p => { p.update(); p.draw(); });

        checkCollisions();

        bullets = bullets.filter(b => !b.marked);
        enemies = enemies.filter(e => !e.marked);
        powerups = powerups.filter(p => !p.marked);
        particles = particles.filter(p => p.life > 0);

        frameCount++;
        requestAnimationFrame(animate);
    }

    function checkCollisions() {
        enemies.forEach(e => {
            bullets.forEach(b => {
                if(Math.hypot(e.x - b.x, e.y - b.y) < 25) {
                    b.marked = true; e.marked = true; score += 10; scoreText.innerText = score;
                    playSound('explosion');
                    for(let i=0; i<10; i++) particles.push(new Particle(e.x, e.y, '#f22'));
                }
            });
            if(Math.hypot(e.x - player.x, e.y - player.y) < 35) {
                e.marked = true; playSound('explosion');
                if(player.shield > 0) player.shield--;
                else player.hp -= 25;
                updateHealth();
            }
        });

        if(bossActive && boss) {
            bullets.forEach(b => {
                if(b.x > boss.x-70 && b.x < boss.x+70 && b.y > boss.y-60 && b.y < boss.y+60) {
                    b.marked = true; boss.hp -= 2;
                    if(boss.hp <= 0) {
                        score += 1000; bossActive = false; boss = null; bossUi.style.display = 'none';
                        playSound('explosion');
                        for(let i=0; i<60; i++) particles.push(new Particle(canvasWidth/2, 150, '#f00'));
                    }
                }
            });
        }

        powerups.forEach(p => {
            if(Math.hypot(p.x - player.x, p.y - player.y) < 40) {
                p.marked = true; playSound('powerup');
                if(p.type === 'S') player.shield = 3;
                if(p.type === 'M') player.multiShot = 40;
                if(p.type === 'H') { player.hp = Math.min(100, player.hp + 40); updateHealth(); }
            }
        });
    }

    function updateHealth() {
        healthBar.style.width = player.hp + '%';
        if(player.hp <= 0) { 
            isGameOver = true; 
            screens.classList.remove('hidden'); 
            document.getElementById('titleText').innerText = "SYSTEM FAILURE"; 
            document.getElementById('titleText').style.color = "#f00";
        }
    }

    const handleMove = (e) => {
        if(isGameOver) return;
        let x = e.touches ? e.touches[0].clientX : e.clientX;
        player.x = x;
    };
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove);
    startBtn.addEventListener('click', initGame);

</script>
</body>
</html>
